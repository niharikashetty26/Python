<!-- myapp/templates/myapp/book_form.html -->
{% extends "myapp/base_generic.html" %}

{% block title %}{{ form.instance.pk|yesno:"Update,Create" }} Book{% endblock %}

{% block content %}
    <h2>{{ form.instance.pk|yesno:"Update,Create" }} Book</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
    <a href="{% url 'book_list' %}">Cancel</a>
{% endblock %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Recipe</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2>Submit a Recipe</h2>
        <form action="{% url 'submit_recipe' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="receipeName">Recipe Name</label>
                <input type="text" class="form-control" id="receipeName" name="receipeName" placeholder="Enter recipe name" required>
            </div>
            <div class="form-group">
                <label for="receipeDescription">Recipe Description</label>
                <textarea class="form-control" id="receipeDescription" name="receipeDescription" rows="3" placeholder="Enter recipe description" required></textarea>
            </div>
            <div class="form-group">
                <label for="receipeImage">Recipe Image</label>
                <input type="file" class="form-control-file" id="receipeImage" name="receipeImage" required>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
</body>
</html>
